<!DOCTYPE html>
<html>
<head>
    <title>Marquee Tag Example</title>
</head>
<body>

<marquee>
Welcome to HTML Programming
</marquee>

<marquee direction="right">
This text moves to the right.
</marquee>

<marquee direction="up" height="60">
This text moves upward.
</marquee>

<marquee behavior="slide">
This text slides once and stops.
</marquee>

<marquee behavior="alternate">
This text bounces between the edges.
</marquee>

<marquee scrollamount="10">
This text scrolls faster.
</marquee>

<marquee loop="3">
This text scrolls only three times.
</marquee>

</body>
</html>
