<html>
    <head>
        <script>
            function confirmbox()
            {
                var txt;
                if(confirm("chose your option"))
                {
                    txt = "you pressed ok";
                }
                else{
                    txt = "you pressed cancle";
                }
                document.getElementById('demo').innerHTML=txt;
            
            }
                    
        </script>
    </head>
    <body>
        <center>
            <h1>Try confirm Box</h1>
            <button onclick="confirmbox();">try it</button>
            <p id="demo"></p>

        </center>
    </body>
</html>
