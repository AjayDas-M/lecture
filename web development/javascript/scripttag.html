<html>
    <head>
        <script>
            function myfun()
            {
                document.getElementById("demo").innerHTML = "paragarph changed";
            }
        </script>
    </head>
    <body>
        <center>
            <h1>MY first Javascript using script tag</h1>
            <button onclick="myfun()">try it</button>
            <p id="demo">button not yet clicked</p>
        </center>
    </body>
</html>
