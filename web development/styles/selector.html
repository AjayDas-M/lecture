<html>
<head>
	<title>selectors</title>
	<style>
		p{
			color:dimgray;
		}
		.highlight{
			background-color:yellow;
		}
		#intro{
			font-size:20px;
		}
		body{
			background-image:url("bg.jpg");
			background-repeat:no-repeat;
			background-position: right top;
			}
	</style>
</head>
<body>
	<p>Welcome to CSS selectors.</p>
	<p class="highlight">This is a normal paragraph.</p>
	<p id="intro">This paragraph is highlighted.</p>
</body>
</html>
