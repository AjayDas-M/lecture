<html>
<head>
	<title>Lists in HTML</title>
</head>
<body>
	<h1>Types of list</h1>
	Unordered list <br>
	ordered list<br>
	definition list<br>
	
	
	<h3>Unordered list</h3>
	
	<ul type="square">
		<li>Apple</li>
		<li>Orange</li>
		<li>grapes</li>

	</ul>
	
	<h3>ordered list</h3>
	
	<ol type="1" start="4">
		<li>Apple</li>
		<li>Orange</li>
		<li>grapes</li>

	</ol>
	
	<h3>Definision list</h3>
	<dl>
		<dt> mouse</dt>
			<dd>It is used to point at item in a computer</dd>
		<dt> keyboard</dt>
				<dd>It is used to point at item in a computer</dd>
	</dl>
</body>
</html>
